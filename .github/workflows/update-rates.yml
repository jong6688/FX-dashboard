name: Update FX rates

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 평일 09:30 KST (UTC 00:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch Hana Bank rates
        run: python scripts/fetch_rates.py

      - name: Upload raw responses (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hana-raw-responses
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rates.json
          git diff --cached --quiet || git commit -m "data: update FX rates $(TZ=Asia/Seoul date +%F)"
          git push
